services:
  postgres-master:
    image: bitnami/postgresql:latest
    container_name: postgres-master
    environment:
      POSTGRESQL_DATABASE: highload-db
      POSTGRESQL_USERNAME: highload-user
      POSTGRESQL_PASSWORD: 12345678
      POSTGRESQL_POSTGRES_PASSWORD: 12345678
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: replica_user
      POSTGRESQL_REPLICATION_PASSWORD: 12345678
    ports:
      - "5432:5432"
    networks:
      - highload
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U highload-user -d highload-db" ]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres-slave-1:
    image: bitnami/postgresql:latest
    container_name: postgres-slave-1
    environment:
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_PASSWORD: 12345678
      POSTGRESQL_POSTGRES_PASSWORD: 12345678
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: replica_user
      POSTGRESQL_REPLICATION_PASSWORD: 12345678
    depends_on:
      - postgres-master
    networks:
      - highload
  postgres-slave-2:
    image: bitnami/postgresql:latest
    container_name: postgres-slave-2
    environment:
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_PASSWORD: 12345678
      POSTGRESQL_POSTGRES_PASSWORD: 12345678
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: replica_user
      POSTGRESQL_REPLICATION_PASSWORD: 12345678
    depends_on:
      - postgres-master
    networks:
      - highload
  haproxy:
    image: haproxy:2.8-alpine
    container_name: highload-haproxy
    ports:
      - "5433:5432"
      - "8404:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - postgres-slave-1
      - postgres-slave-2
    networks:
      - highload
  redis:
    image: redis:7-alpine
    container_name: highload-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - highload
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: highload-redis-insight
    ports:
      - "5540:5540"
    networks:
      - highload
    depends_on:
      redis:
        condition: service_healthy
  tarantool:
    image: tarantool/tarantool:latest
    container_name: tarantool
    ports:
      - "3301:3301"
    volumes:
      - ./tarantool:/opt/tarantool
    environment:
      - TT_USER=admin
      - TT_PASSWORD=admin
    command: tarantool /opt/tarantool/init.lua
    networks:
      - highload
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        MODULE_NAME: "app"
    environment:
      - SPRING_DATASOURCE_MASTER_URL=jdbc:postgresql://postgres-master:5432/highload-db
      - SPRING_DATASOURCE_SLAVE_URL=jdbc:postgresql://haproxy:5432/highload-db
      - SPRING_DATASOURCE_USERNAME=highload-user
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JDK_JAVA_OPTIONS=--add-opens=java.base/sun.nio.ch=ALL-UNNAMED
    depends_on:
      postgres-master:
        condition: service_healthy
      haproxy:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - highload
    deploy:
      replicas: 2
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        MODULE_NAME: "auth"
    container_name: highload-auth
    ports:
      - "8083:8083"
    networks:
      - highload
  dialog:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        MODULE_NAME: "dialog"
    container_name: highload-dialog
    ports:
      - "8086:8086"
    environment:
      - JDK_JAVA_OPTIONS=--add-opens=java.base/sun.nio.ch=ALL-UNNAMED
    depends_on:
      tarantool:
        condition: service_started
    networks:
      - highload
  nginx:
    image: nginx:1.25-alpine
    container_name: highload-nginx
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - highload

networks:
  highload:
    name: highload
    driver: bridge
