services:
  postgres:
    image: postgres:17-alpine
    container_name: counter-postgres
    environment:
      POSTGRES_DB: counter-db
      POSTGRES_USER: counter-user
      POSTGRES_PASSWORD: 12345678
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U highload-user -d highload-db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "7432:5432"
    networks:
      - highload
  redis:
    image: redis:7.4-alpine
    container_name: highload-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - highload
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: highload-redis-insight
    ports:
      - "5540:5540"
    networks:
      - highload
    depends_on:
      redis:
        condition: service_healthy
  tarantool:
    image: tarantool/tarantool:latest
    container_name: tarantool
    ports:
      - "3301:3301"
    volumes:
      - ./tarantool:/opt/tarantool
    environment:
      - TT_USER=admin
      - TT_PASSWORD=admin
    command: tarantool /opt/tarantool/init.lua
    networks:
      - highload
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: highload-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: [ "CMD", "kafka-cluster", "cluster-id", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - highload

networks:
  highload:
    name: highload
    driver: bridge
