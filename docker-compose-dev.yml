services:
  postgres:
    image: postgres:17-alpine
    container_name: highload-postgres
    environment:
      POSTGRES_DB: highload-db
      POSTGRES_USER: highload-user
      POSTGRES_PASSWORD: 12345678
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U highload-user -d highload-db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - highload
    entrypoint: [ "bash", "-c", "exec docker-entrypoint.sh postgres & while ! pg_isready -q; do sleep 1; done; psql -U highload-user -d highload-db -c 'CREATE DATABASE zabbix;'; wait" ]
  redis:
    image: redis:7.4-alpine
    container_name: highload-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - highload
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: highload-redis-insight
    ports:
      - "5540:5540"
    networks:
      - highload
    depends_on:
      redis:
        condition: service_healthy
  tarantool:
    image: tarantool/tarantool:latest
    container_name: tarantool
    ports:
      - "3301:3301"
    volumes:
      - ./tarantool:/opt/tarantool
    environment:
      - TT_USER=admin
      - TT_PASSWORD=admin
    command: tarantool /opt/tarantool/init.lua
    networks:
      - highload
  prometheus:
    image: prom/prometheus:latest
    container_name: highload-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - highload
  grafana:
    image: grafana/grafana:latest
    container_name: highload-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - highload
    depends_on:
      - prometheus
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-latest
    container_name: zabbix-server
    ports:
      - "10051:10051"
    environment:
      - DB_SERVER_HOST=highload-postgres
      - DB_SERVER_PORT=5432
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=highload-user
      - POSTGRES_PASSWORD=12345678
    networks:
      - highload
    depends_on:
      postgres:
        condition: service_healthy
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-latest
    container_name: zabbix-web
    ports:
      - "8080:8080"
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=highload-postgres
      - DB_SERVER_PORT=5432
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=highload-user
      - POSTGRES_PASSWORD=12345678
      - PHP_TZ=Europe/Moscow
    networks:
      - highload
    depends_on:
      - zabbix-server

networks:
  highload:
    name: highload
    driver: bridge
