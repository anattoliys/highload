global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 4s
    timeout client  45s
    timeout server  45s

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
    stats admin if TRUE

frontend postgres_slave_front
    bind *:5432
    default_backend postgres_slave_back

backend postgres_slave_back
    mode tcp
    balance roundrobin
    option tcp-check
    server slave1 postgres-slave-1:5432 check inter 2s fall 2 rise 2
    server slave2 postgres-slave-2:5432 check inter 2s fall 2 rise 2
